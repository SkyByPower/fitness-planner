# Render.com Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fitness-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Тегін тарифте диск уақытша: әр іске қосылғанда ДҚ құрылып, тест деректер қосылады
    startCommand: flask init-db && flask seed && gunicorn run:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_APP
        value: run.py
      - key: SECRET_KEY
        generateValue: true
